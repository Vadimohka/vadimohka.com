name: Refine measured image delivery
on:
  push:
    branches: [maintenance/site-health]
    paths: ['.github/workflows/refine-health-images.yml']
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m pip install Pillow==12.3.0
      - name: Add intermediate candidates and matching preload hints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,re,hashlib,subprocess
          R=Path.cwd();H=lambda b:hashlib.sha256(b.encode() if isinstance(b,str) else b).hexdigest()
          for name in ['architecture','workspace']:
              image=Image.open(R/f'assets/executive/{name}.webp')
              image.resize((768,round(image.height*768/image.width)),Image.Resampling.LANCZOS).save(R/f'assets/executive/{name}-768.webp',quality=82,method=6)
          for f in R.glob('*.html'):
              if f.name=='index.html':continue
              text=f.read_text()
              for name in ['architecture','workspace']:
                  text=text.replace(f'assets/executive/{name}-640.webp 640w, assets/executive/{name}.webp',f'assets/executive/{name}-640.webp 640w, assets/executive/{name}-768.webp 768w, assets/executive/{name}.webp')
              text=text.replace('assets/executive/dubai-640.webp 640w, assets/executive/dubai.webp','assets/executive/dubai-640.webp 640w, assets/executive/dubai-960.webp 960w, assets/executive/dubai.webp')
              text=text.replace('(max-width: 700px) 160px, (max-width: 1100px) 33vw, 370px','(max-width: 760px) calc(100vw - 42px), (max-width: 1280px) calc((100vw - 120px) / 2), 568px')
              f.write_text(text)
          p=R/'qa/health/generate-discovery.py';text=p.read_text()
          marker="    if name=='404.html':lines.insert(1,'<base href=\"/\" />')"
          assert marker in text
          extra='''    hero_photos={'work.html':'architecture','enterprise.html':'architecture','founders.html':'workspace','expert.html':'workspace'}
              if name in hero_photos:
                  photo=hero_photos[name]
                  lines.append(f'<link rel="preload" as="image" href="assets/executive/{photo}.webp" imagesrcset="assets/executive/{photo}-640.webp 640w, assets/executive/{photo}-768.webp 768w, assets/executive/{photo}.webp 1000w" imagesizes="(max-width: 760px) calc(100vw - 40px), (max-width: 1100px) 45vw, 600px" type="image/webp" fetchpriority="high" />')
          '''
          extra='\n'.join(line[10:] if line.startswith('          ') else line for line in extra.splitlines())+'\n'
          p.write_text(text.replace(marker,extra+marker))
          subprocess.run(['python3','qa/health/generate-discovery.py','--write'],check=True)
          p=R/'qa/health/approved-changes.json';approved=json.loads(p.read_text())
          for key,entry in approved['hashes'].items():
              if key.startswith('internal-head:'):
                  page=key.split(':',1)[1];entry['after']=H(re.search(r'<head>[\s\S]*?</head>',(R/page).read_text())[0].replace('<link rel="stylesheet" href="assets/internal.css" />',''))
          p.write_text(json.dumps(approved,indent=2)+'\n')
          p=R/'assets/executive/credits.json';data=json.loads(p.read_text());data['responsive_variants']='The -640.webp, -768.webp and dubai-960.webp files are proportionally resized from the corresponding credited originals, encoded as WebP at quality 82. Original media remains unchanged.';p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          node qa/check.mjs
          node qa/executive-content.mjs
          python3 qa/health/check.py
      - name: Save image delivery changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' assets/executive qa/health
          git commit -m 'perf: preload responsive hero images and match publication sizes to the actual layout'
          git push origin HEAD:maintenance/site-health
