name: Apply verified tablet document correction
on:
  push:
    branches: [design/internal-editorial-refinement]
    paths: [.github/workflows/tablet-type-review.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/internal-editorial-refinement
      - name: Apply tablet correction and protect it
        run: |
          test "$GITHUB_REF" = refs/heads/design/internal-editorial-refinement
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/internal.css');p.write_text(p.read_text()+'''/* Narrow split heroes use a smaller type scale inside the illustrative document. */
          @media (min-width:761px) and (max-width:1100px){.inner-page .review-page--front h3{font-size:clamp(20px,2.55vw,28px)}}
          ''')
          p=Path('qa/browser/check.mjs');t=p.read_text()
          needle="if (!type.family.includes('Playfair Display') || type.size < 37) throw new Error(`${route}: editorial headline hierarchy regressed`);"
          assert needle in t
          t=t.replace(needle, needle+'''
                  const brokenNumbers = await page.locator('.page-index a span:first-child').evaluateAll(ns => ns.filter(n => n.offsetHeight > parseFloat(getComputedStyle(n).lineHeight) + 1).length);
                  if (brokenNumbers) throw new Error(`${route} ${viewport.name}: chapter numbers wrap`);
                  if (route === 'investors.html') {
                    const inset = await page.locator('.review-page--front').evaluate(el => { const f=el.querySelector('.report-foot'); return el.clientHeight - f.offsetTop - f.offsetHeight; });
                    if (inset < 8) throw new Error(`${route} ${viewport.name}: illustrated document content clips (${inset}px inset)`);
                  }
          ''')
          p.write_text(t)
          PY
          node qa/check.mjs && node qa/test-regressions.mjs && node qa/executive-content.mjs
      - name: Commit without preparation tooling
        run: |
          git rm .github/workflows/tablet-type-review.yml
          git add assets/internal.css qa/browser/check.mjs
          git diff --exit-code HEAD -- index.html assets/site.css assets/site.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve the document composition at narrow tablet widths and guard against visual clipping'
          git push origin HEAD:design/internal-editorial-refinement
