name: Site health
on:
  workflow_dispatch:
  push:
    branches: [maintenance/site-health]
    paths: ['.github/workflows/site-health.yml', 'qa/health/**']
  pull_request:
    paths: ['*.html', '*.xml', '*.txt', '*.md', 'assets/**', 'data/**', 'qa/health/**', '.github/workflows/site-health.yml', '.github/workflows/deploy.yml']
permissions:
  contents: read
concurrency:
  group: site-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Lighthouse
        run: npm install --prefix /tmp/site-lighthouse --no-audit --no-fund lighthouse@13.4.1
      - name: Measure baseline and candidate with identical lab conditions
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p /tmp/site-before /tmp/site-after qa/health/results
          git archive a5fd47a74aefa09336194202b312298b21dc8cbf | tar -x -C /tmp/site-before
          git archive HEAD | tar -x -C /tmp/site-after
          python3 -m http.server 4181 --bind 127.0.0.1 --directory /tmp/site-before >/tmp/site-before.log 2>&1 &
          python3 -m http.server 4182 --bind 127.0.0.1 --directory /tmp/site-after >/tmp/site-after.log 2>&1 &
          python3 - <<'PY'
          import json, os, subprocess, time, pathlib, urllib.request, urllib.error
          out=pathlib.Path('qa/health/results'); time.sleep(1)
          lighthouse='/tmp/site-lighthouse/node_modules/.bin/lighthouse'
          rows=[]
          candidate_changed=subprocess.check_output(['git','diff','--name-only','a5fd47a74aefa09336194202b312298b21dc8cbf','HEAD','--','*.html','assets/']).decode().strip()
          for version,port in [('before',4181)]+([('after',4182)] if candidate_changed else []):
            for route,profile,count in [('index.html','mobile',3),('index.html','desktop',1),('century.html','mobile',1),('about.html','mobile',1),('work.html','mobile',1)]:
              for trial in range(count):
                prefix=out/f'{version}-{route[:-5]}-{profile}-{trial+1}'
                args=[lighthouse,f'http://127.0.0.1:{port}/{route}','--output=json',f'--output-path={prefix}.json','--only-categories=performance,accessibility,best-practices,seo','--chrome-flags=--headless=new --no-sandbox','--quiet']
                if profile=='desktop': args.append('--preset=desktop')
                subprocess.run(args,check=True,timeout=150)
                report=json.loads(pathlib.Path(str(prefix)+'.json').read_text()); audits=report['audits']
                row={'version':version,'page':route,'profile':profile,'trial':trial+1,'lighthouse':report['lighthouseVersion'],'fetchTime':report['fetchTime'],'scores':{k:round(v['score']*100) if v.get('score') is not None else None for k,v in report['categories'].items()},'metrics':{k:audits.get(k,{}).get('numericValue') for k in ['largest-contentful-paint','first-contentful-paint','cumulative-layout-shift','total-blocking-time','speed-index','total-byte-weight']},'failedAudits':[{ 'id':k,'title':v['title'],'displayValue':v.get('displayValue'),'details':v.get('details')} for k,v in audits.items() if v.get('score') is not None and v['score']<1 and v.get('scoreDisplayMode') not in ['notApplicable','manual','informative']]}
                rows.append(row); (out/'summary.json').write_text(json.dumps(rows,indent=2)); print(json.dumps({k:v for k,v in row.items() if k!='failedAudits'}),flush=True)
          http=[]
          for path in ['','about.html','century.html','enterprise.html','founders.html','investors.html','work.html','expert.html','sources.html','robots.txt','sitemap.xml','sitemap-images.xml','sitemap-ai.xml','llms.txt','ai-profile.md','data/entity-graph.json','does-not-exist-site-health.html']:
            url='https://vadimohka.com/'+path; start=time.perf_counter()
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Vadimohka-Site-Health/1.0','Accept-Encoding':'gzip'})
              with urllib.request.urlopen(req,timeout=20) as response:
                body=response.read(); http.append({'url':url,'status':response.status,'finalURL':response.url,'seconds':round(time.perf_counter()-start,3),'bytes':len(body),'headers':{k:v for k,v in response.headers.items() if k.lower() in ['content-type','cache-control','content-encoding','etag','last-modified','server']}})
            except urllib.error.HTTPError as e: http.append({'url':url,'status':e.code,'seconds':round(time.perf_counter()-start,3)})
            except Exception as e: http.append({'url':url,'error':str(e)})
          (out/'live-http.json').write_text(json.dumps(http,indent=2))
          try:
            url='https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Fvadimohka.com%2F&strategy=mobile&category=performance'
            with urllib.request.urlopen(url,timeout=90) as response:
              psi=json.load(response)
            (out/'field-data.json').write_text(json.dumps({k:psi.get(k) for k in ['id','loadingExperience','originLoadingExperience','analysisUTCTimestamp']},indent=2))
          except Exception as e:(out/'field-data.json').write_text(json.dumps({'unavailable':str(e)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-health-results
          path: qa/health/results
          retention-days: 14
