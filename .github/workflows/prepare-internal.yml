name: Prepare internal page redesign
on:
  push:
    branches: [design/internal-executive-03]
    paths: ['qa/prepare-internal.py', 'assets/internal.css', '.github/workflows/prepare-internal.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/design/internal-executive-03'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/internal-executive-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install beautifulsoup4==4.14.3 soupsieve==2.8.4
      - name: Apply the source-guarded presentation transform
        run: python qa/prepare-internal.py
      - name: Verify content and static site
        run: node qa/check.mjs && node qa/test-regressions.mjs && node qa/executive-content.mjs
      - name: Commit only reviewed internal pages and their guards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 404.html about.html century.html enterprise.html expert.html founders.html investors.html sources.html work.html assets/internal.css qa/internal-content.mjs qa/internal-content-baseline.json qa/executive-content.mjs qa/browser/check.mjs
          git rm qa/prepare-internal.py .github/workflows/prepare-internal.yml
          git diff --cached --stat
          git commit -m 'design: rebuild nine internal pages in the approved Executive 03 style'
          git push origin HEAD:design/internal-executive-03
