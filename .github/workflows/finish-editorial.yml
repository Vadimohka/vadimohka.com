name: Finish reviewed editorial details
on:
  push:
    branches: [design/internal-editorial-refinement]
    paths: [.github/workflows/finish-editorial.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/internal-editorial-refinement
      - name: Apply final reviewed corrections
        run: |
          test "$GITHUB_REF" = refs/heads/design/internal-editorial-refinement
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/internal.css')
          p.write_text(p.read_text()+'''\n/* Keep numeric chapter labels on one line and give illustrated documents a real bottom inset. */
          .inner-page .page-index a span{flex-shrink:0;white-space:nowrap}
          .inner-page .page-index a span:first-child{min-width:14px}
          .inner-page .review-page--front .report-list>div{min-height:28px}
          .inner-page .review-page--front .report-foot{margin-top:8px}
          ''')
          p=Path('qa/browser/check.mjs');t=p.read_text()
          t=t.replace("{width:1024,height:768,name:'1024'},", "{width:1101,height:900,name:'1101'},\n  {width:1100,height:900,name:'1100'},\n  {width:1024,height:768,name:'1024'},")
          p.write_text(t)
          PY
          node qa/check.mjs
          node qa/test-regressions.mjs
          node qa/executive-content.mjs
      - name: Commit final output without preparation tooling
        run: |
          git rm .github/workflows/finish-editorial.yml
          git add assets/internal.css qa/browser/check.mjs
          git diff --exit-code HEAD -- index.html assets/site.css assets/site.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep chapter numbers intact and add breathing room within review illustrations'
          git push origin HEAD:design/internal-editorial-refinement
